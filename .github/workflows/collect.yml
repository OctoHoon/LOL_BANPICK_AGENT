# 매일 Riot API로 팀원 전적과 KR 상위권 메타 통계를 모아 data/ 에 커밋한다.
# 저장소 Settings > Secrets and variables > Actions 에 RIOT_API_KEY 를 넣어야 동작한다.
name: 전적·메타 수집

on:
  schedule:
    - cron: '0 20 * * *' # 매일 한국 시각 05:00
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 수집
        env:
          RIOT_API_KEY: ${{ secrets.RIOT_API_KEY }}
        run: node scripts/collect.mjs
      - name: 변경분 커밋
        run: |
          git config user.name "banpick-collector"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then echo "변경 없음"; exit 0; fi
          git commit -m "전적·메타 통계 갱신 $(date -u +%Y-%m-%d)"
          git push
